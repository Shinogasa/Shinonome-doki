baseurl = "https://shinonono.net"
# テーマは末尾の [module] で読み込む（AMPテンプレートを除外するため theme 設定は使わない）
# サイトタイトルは languages.toml の [ja].title が実効値（言語別設定に一本化）

defaultContentLanguage = "ja"
hasCJKLanguage = true

timeZone = "Asia/Tokyo"

# X/Twitter埋め込みshortcodeのリモート取得警告を抑止（本番ビルドで頻発するため）
ignoreLogs = ['shortcode-x-getremote']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]
  [languages.ja]
    label = "Japanese"
    weight = 1

[services]
  [services.disqus]
    shortname = ''
  [services.googleAnalytics]
    id = 'G-N0QXRZ562X' # Optical

[permalinks]
  posts = "/posts/:slug/"

[params]
# サイト説明文は languages.toml の [ja.params].description が実効値（言語別設定に一本化）
dateformat = "Jan 2, 2006" # Optional
# Fonts settings.
googlefonts = "https://fonts.googleapis.com/css?family=Lobster|Lato:400,700&display=swap" # Optional, Include google fonts.
fontfamily = "Lato,YuGothic,'Hiragino Kaku Gothic Pro',Meiryo,sans-serif" # Optional, Override body font family.
logofontfamily = "Lobster, cursive" # Optional, Override logo font.

# コードハイライトは Hugo 内蔵の Chroma がビルド時に行うため highlight.js は使わない。
# 配色を変えたい場合は [markup.highlight] の style を指定する。

[params.author]
thumbnail = "/images/profile.jpeg"
name = "しののめ"
description = "<p>Webエンジニアです。</p><p>いろんなことを書いています。</p>"
twitter = "https://x.com/Shinogasa"
github = "https://github.com/Shinogasa"

[outputs]
# AMP は出力しない。Google は 2021年の Page Experience アップデートで Top Stories の
# AMP 必須要件を廃止しており、現在 AMP に検索上の優遇は無い（評価軸は Core Web Vitals）。
# 141ページを二重生成し、テンプレート変更のたびに AMP 側の影響を考えるコストだけが残るため外した。
page = [ "HTML" ]

[module]
# テーマの AMP テンプレート（*.amp.html）を読み込み対象から外す。
# 出力形式で AMP を止めても、テーマの baseof.amp.html は 404 ページの baseof 候補に残り、
# ビルドごとに非決定的に選ばれていた（0.164.0〜0.169.0 で確認）。さらに同ファイルは
# libsass（toCSS）を呼ぶため、libsass が削除された Hugo ではビルドがランダムに失敗する。
# mounts を書くとテーマの既定マウントは置き換わるため、テーマが持つディレクトリを全て列挙する。
  [[module.imports]]
    path = "robust"
    [[module.imports.mounts]]
      source = "layouts"
      target = "layouts"
      files = ["! **.amp.html"]
    [[module.imports.mounts]]
      source = "assets"
      target = "assets"
    [[module.imports.mounts]]
      source = "static"
      target = "static"
    [[module.imports.mounts]]
      source = "archetypes"
      target = "archetypes"

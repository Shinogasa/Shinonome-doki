baseurl = "https://shinonono.net"
title = "シノノメドキ"
theme = "robust"

defaultContentLanguage = "ja"
hasCJKLanguage = true

timeZone = "Asia/Tokyo"

[languages]
  [languages.ja]
    label = "Japanese"
    weight = 1
    title = "シノノメドキ"

[services]
  [services.disqus]
    shortname = ''
  [services.googleAnalytics]
    id = 'G-N0QXRZ562X' # Optical

[permalinks]
  posts = "/posts/:slug/"

[params]
description = "しののめの個人ブログ。Webエンジニアリングや日常について書いています。"
dateformat = "Jan 2, 2006" # Optional
# Fonts settings.
googlefonts = "https://fonts.googleapis.com/css?family=Lobster|Lato:400,700&display=swap" # Optional, Include google fonts.
fontfamily = "Lato,YuGothic,'Hiragino Kaku Gothic Pro',Meiryo,sans-serif" # Optional, Override body font family.
logofontfamily = "Lobster, cursive" # Optional, Override logo font.

# コードハイライトは Hugo 内蔵の Chroma がビルド時に行うため highlight.js は使わない。
# 配色を変えたい場合は [markup.highlight] の style を指定する。

[params.author]
thumbnail = "/images/profile.jpeg"
name = "しののめ"
description = "<p>Webエンジニアです。</p><p>いろんなことを書いています。</p>"
twitter = "https://x.com/Shinogasa"
github = "https://github.com/Shinogasa"

[outputs]
page = [ "HTML", "AMP" ] # if you want AMP enable.

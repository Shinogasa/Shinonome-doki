name: Trigger Deploy

# PRのマージはmainへのpushを伴うため、push だけでマージも手動マージも拾える。
# pull_request(closed) を併記すると1回のマージで2回デプロイが走る。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "デプロイするブランチ"
        required: true
        default: "main"
        type: string

permissions: {} # GITHUB_TOKEN は使わない（デプロイは secrets.INFRA_REPO_PAT で行う）

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment workflow
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.INFRA_REPO_PAT }}
          repository: Shinogasa/Shinonome-doki-infra
          event-type: deploy-hugo
          client-payload: '{"branch": ${{ toJSON(github.event.inputs.branch || github.ref_name) }}}'
